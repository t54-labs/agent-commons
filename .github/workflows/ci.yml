name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools and Commons
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
      - name: Run Python tests
        run: make test-python
      - name: Build distribution
        run: python -m build
      - name: Run deterministic coordination scenarios
        run: make demo

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check links, public paths, packaged Skill, and publication hygiene
        run: |
          make docs-check
          make public-check
          make release-source-check

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm --prefix web ci
      - name: Build Console
        run: npm --prefix web run build
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm --prefix web run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failure-artifacts
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  product-video:
    name: Product video
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install product-video dependencies
        run: npm --prefix video ci
      - name: Type-check product-video source
        run: npm --prefix video run check

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Compose configuration
        env:
          COMMONS_RELAY_TOKEN: ci-compose-token
        run: docker compose config --quiet
      - name: Build Relay image
        run: docker build --target relay --tag commons-relay:ci .
      - name: Build Console image
        run: docker build --target console --tag commons-console:ci .
