name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python ${{ matrix.python-version }} release gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Commons
        run: python -m pip install -e .
      - name: Run Python release gate
        run: make test-python

  product:
    name: Product release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Commons and Console dependencies
        run: |
          python -m pip install -e .
          npm --prefix web ci
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Run complete product gate
        run: make test-all
      - name: Run deterministic coordination scenarios
        run: make demo
      - name: Validate Compose configuration
        env:
          COMMONS_RELAY_TOKEN: release-compose-token
        run: docker compose config --quiet
      - name: Build Relay image
        run: docker build --target relay --tag commons-relay:release .
      - name: Build Console image
        run: docker build --target console --tag commons-console:release .

  release:
    name: Build and publish release
    needs:
      - python
      - product
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release tag
        run: |
          package_version="$(python -c 'from commons import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - name: Build Python distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Build Console artifact
        run: |
          npm --prefix web ci
          npm --prefix web run build
          tar -C web/dist -czf "dist/commons-console-${GITHUB_REF_NAME}.tar.gz" .
      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
