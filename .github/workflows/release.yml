name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python ${{ matrix.python-version }} release gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Commons
        run: python -m pip install -e .
      - name: Run Python release gate
        run: make test-python

  product:
    name: Product release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Commons and Console dependencies
        run: |
          python -m pip install -e .
          npm --prefix web ci
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Run complete product gate
        run: make test-all
      - name: Run deterministic coordination scenarios
        run: make demo
      - name: Validate Compose configuration
        env:
          COMMONS_RELAY_TOKEN: release-compose-token
        run: docker compose config --quiet
      - name: Build Relay image
        run: docker build --target relay --tag commons-relay:release .
      - name: Build Console image
        run: docker build --target console --tag commons-console:release .

  build:
    name: Build release artifacts once
    needs:
      - python
      - product
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install release build tools
        run: python -m pip install --upgrade build twine
      - name: Verify release identity and onboarding pins
        run: python scripts/check_release_artifacts.py --tag "$GITHUB_REF_NAME"
      - name: Build Python distributions
        run: python -m build --outdir dist/python
      - name: Validate Python distributions
        run: |
          python -m twine check dist/python/*
          python scripts/check_release_artifacts.py --tag "$GITHUB_REF_NAME" --dist-dir dist/python
      - name: Build Console artifact
        run: |
          npm --prefix web ci
          npm --prefix web run build
          mkdir -p dist/release
          tar -C web/dist -czf "dist/release/commons-console-${GITHUB_REF_NAME}.tar.gz" .
      - name: Assemble GitHub release bundle
        run: |
          cp dist/python/* dist/release/
          cd dist/release
          sha256sum agent_commons-* commons-console-* > SHA256SUMS
      - name: Store Python distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-package-distributions
          path: dist/python/
          if-no-files-found: error
          retention-days: 7
      - name: Store GitHub release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-release-bundle
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download GitHub release bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: github-release-bundle
          path: dist/release
      - name: Attest public release artifacts
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag

  pypi:
    name: Publish Python distributions to PyPI
    needs:
      - github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-commons
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
