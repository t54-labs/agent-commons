[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-commons"
version = "0.3.0"
description = "Private, self-hosted coordination control plane for coding agents"
readme = "PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "T54 Labs" }
]
keywords = [
  "ai-agents",
  "claude-code",
  "codex",
  "coding-agents",
  "developer-tools",
  "multi-agent",
  "self-hosted",
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
  "Topic :: System :: Distributed Computing",
]

[project.scripts]
commons = "commons.cli:main"
commonsd = "commons.daemon:main"

[tool.setuptools]
packages = ["commons", "commons.skill_template"]

[tool.setuptools.package-data]
commons = ["skill_template/SKILL.md"]
